name: presence-core

# CORTEX green-online daemon. Jobs overlap by design:
# schedule every 3h + job lifetime ~5h55m ⇒ at any moment at least one
# live gateway session holds the green dot. No concurrency group so two
# sessions may overlap seamlessly at handover.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"

jobs:
  presence:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install presence deps
        run: npm install ws --no-audit --no-fund

      - name: Diagnose credentials (no secrets printed)
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          echo "token_length=${#DISCORD_BOT_TOKEN} (expected 70)"
          node -e "const t=process.env.DISCORD_BOT_TOKEN;fetch('https://discord.com/api/v10/users/@me',{headers:{Authorization:'Bot '+t}}).then(async r=>{const j=await r.json().catch(()=>null);console.log('users/@me ->',r.status, j&&j.username?('user='+j.username+'#'+(j.discriminator||'0')):JSON.stringify(j))})"

      - name: Hold the green dot
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_PRESENCE_TEXT: "PROTECTING THE CORTEX NETWORK"
          DISCORD_PRESENCE_TYPE: "3"
          GATEWAY_CONNECT_DEADLINE_MS: "60000"
          CORTEX_WELCOME_URL: "https://cortex-ac.vercel.app/api/welcome"
          CORTEX_TRIGGER_KEY: ${{ secrets.CORTEX_TRIGGER_KEY }}
        run: node presence-core.mjs
